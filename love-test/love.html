  }
};

// ===== 逻辑 =====
// 计分：每个选项累加对应倾向，最后取最高分
// A=纯洁系(unicorn/elf/moon-cat) B=炽烈系(dragon/vampire/phoenix/nightmare) C=自由系(kitsune/dark-elf) D=深情系(werewolf/mermaid/griffin)
let scores = { A: 0, B: 0, C: 0, D: 0 };
let qIndex = 0;

// 动态生成题目页
function buildQuestions() {
  const container = document.getElementById('question-pages');
  questions.forEach((item, i) => {
	const pageNum = i + 2; // p2开始
	const div = document.createElement('div');
	div.className = 'page';
	div.id = 'p' + pageNum;
	div.innerHTML = `
	  <div class="progress"><div class="progress-bar" id="bar${pageNum}"></div></div>
	  <div class="q-title">${item.q}</div>
	  <div class="options">
		<div class="opt" onclick="answer('A')">${item.a}</div>
		<div class="opt" onclick="answer('B')">${item.b}</div>
		<div class="opt" onclick="answer('C')">${item.c}</div>
		<div class="opt" onclick="answer('D')">${item.d}</div>
	  </div>
	`;
	container.appendChild(div);
  });
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function answer(type) {
  scores[type]++;
  qIndex++;
  // 更新进度条
  const pct = (qIndex / questions.length * 100).toFixed(0);
  // 找当前页的进度条
  const bars = document.querySelectorAll('.progress-bar');
  if (bars[qIndex - 1]) bars[qIndex - 1].style.width = pct + '%';
  if (qIndex < questions.length) {
	showPage('p' + (qIndex + 2));
  } else {
	showResult();
  }
}

function showResult() {
  // 找最高分类别，映射到具体幻想种
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const top = sorted[0][0];
  // 同类别内有细分，用第二偏好做微调
  const second = sorted[1][0];
  let key = pickResult(top, second);
  let res = results[key];
  document.getElementById('res-img').src = res.img;
  document.getElementById('res-name').innerText = '『 ' + res.name + ' 』';
  document.getElementById('res-score').innerText = res.score + '：' + (85 + Math.floor(Math.random()*15)) + '%';
  document.getElementById('res-stars').innerText = res.stars;
  document.getElementById('res-tags').innerHTML = res.tags.map(t => '<span class="tag">' + t + '</span>').join('');
  document.getElementById('res-desc').innerText = res.desc;
  document.getElementById('res-personality').innerText = res.personality;
  document.getElementById('res-origin').innerText = res.origin;
  showPage('result');
}

function pickResult(top, second) {
  // 根据最高分和次高分，在12种中做出差异化选择
  const purity = ['unicorn', 'elf', 'moon-cat'];       // 纯洁/精神系
  const passion = ['dragon', 'vampire', 'phoenix', 'nightmare']; // 炽烈/占有系
  const free = ['kitsune', 'dark-elf'];                  // 自由/神秘系
  const deep = ['werewolf', 'mermaid', 'griffin'];       // 深情/守护系
  const groups = { A: purity, B: passion, C: free, D: deep };
  const group = groups[top];
  // 用第二偏好在不同组别间做丰富化，避免总出同一个
  let idx = 0;
  if (top === 'A') idx = (second === 'B') ? 0 : (second === 'C' ? 1 : 2);
  if (top === 'B') idx = (second === 'D') ? 0 : (second === 'A' ? 1 : (second === 'C' ? 2 : 3));
  if (top === 'C') idx = (second === 'B') ? 0 : 1;
  if (top === 'D') idx = (second === 'B') ? 0 : (second === 'C' ? 1 : 2);
  return group[Math.min(idx, group.length - 1)];
}

buildQuestions();
</script>
